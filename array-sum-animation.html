<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열 합계 단계별 실행</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1d2733;
      --muted: #6a7686;
      --line: #dde4ee;
      --primary: #2f6fed;
      --primary-soft: #e4edff;
      --accent: #ff8a3d;
      --accent-soft: #fff0e3;
      --ok: #1fa971;
      --ok-soft: #dff6ec;
      --code-bg: #14202e;
      --code-text: #d7e3f4;
      --code-active: #2a4a7a;
      --console-bg: #0c141d;
      --console-text: #7ee2a8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1620;
        --panel: #182230;
        --text: #e6edf6;
        --muted: #93a1b4;
        --line: #2a3849;
        --primary: #6c9bff;
        --primary-soft: #1f3157;
        --accent: #ffa05c;
        --accent-soft: #4a3220;
        --ok: #43d194;
        --ok-soft: #173c2e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 16px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 16px; font-size: .95rem; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .panel h2 { font-size: .95rem; color: var(--muted); margin-bottom: 10px; font-weight: 600; }

    .top { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }

    /* ---------- 코드 ---------- */
    .code { background: var(--code-bg); border-color: var(--code-bg); }
    .code h2 { color: #8fa3bd; }
    .code-line {
      display: flex;
      font-family: Consolas, "D2Coding", monospace;
      font-size: .95rem;
      color: var(--code-text);
      padding: 3px 8px;
      border-radius: 6px;
      border-left: 3px solid transparent;
      white-space: pre;
      overflow-x: auto;
    }
    .code-line .no { width: 26px; flex: none; color: #5c7391; user-select: none; }
    .code-line.active { background: var(--code-active); border-left-color: var(--accent); }
    .note { margin-top: 8px; font-size: .78rem; color: #8fa3bd; }

    /* ---------- 변수 ---------- */
    .vars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .var {
      position: relative;
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
      background: var(--bg);
    }
    .var .name { font-size: .8rem; color: var(--muted); font-family: Consolas, monospace; }
    .var .val { font-size: 1.6rem; font-weight: bold; min-height: 2.1rem; font-variant-numeric: tabular-nums; }
    .var.empty .val { color: var(--muted); font-weight: normal; }
    .var.pulse { animation: pulse .6s ease; }
    @keyframes pulse {
      0% { transform: scale(1); border-color: var(--accent); background: var(--accent-soft); }
      40% { transform: scale(1.1); border-color: var(--accent); background: var(--accent-soft); }
      100% { transform: scale(1); }
    }
    .plus {
      position: absolute;
      left: 50%;
      top: -6px;
      transform: translateX(-50%);
      font-weight: bold;
      color: var(--ok);
      opacity: 0;
      pointer-events: none;
    }
    .plus.fly { animation: fly 1s ease-out; }
    @keyframes fly {
      0% { opacity: 0; top: 30px; }
      20% { opacity: 1; }
      100% { opacity: 0; top: -34px; }
    }

    .explain {
      background: var(--primary-soft);
      border-radius: 10px;
      padding: 12px 14px;
      min-height: 96px;
    }
    .explain .title { font-weight: bold; margin-bottom: 4px; color: var(--primary); }
    .explain .desc { font-size: .98rem; }

    /* ---------- 배열 ---------- */
    .array-wrap { margin-bottom: 14px; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
    .cell {
      text-align: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 3px 0 2px;
      background: var(--bg);
      transition: background .25s, border-color .25s, transform .25s, opacity .25s;
    }
    .cell b { display: block; font-size: .95rem; font-variant-numeric: tabular-nums; }
    .cell small { display: block; font-size: .62rem; color: var(--muted); }
    .grid.hidden .cell { opacity: .25; }
    .cell.done { background: var(--ok-soft); border-color: var(--ok); }
    .cell.current { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.12); }
    .cell.current.added { background: var(--ok-soft); border-color: var(--ok); }
    .cell.pick { background: var(--primary-soft); border-color: var(--primary); transform: scale(1.12); }

    /* ---------- 콘솔 ---------- */
    .console { background: var(--console-bg); border-color: var(--console-bg); margin-bottom: 14px; }
    .console h2 { color: #6e8299; }
    #console { font-family: Consolas, monospace; color: var(--console-text); min-height: 56px; font-size: 1rem; }
    #console div::before { content: "> "; color: #4a6a58; }
    #console .empty { color: #5a6b7c; }
    #console .empty::before { content: ""; }

    /* ---------- 컨트롤 ---------- */
    .controls { position: sticky; bottom: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .12); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--primary); }
    button:disabled { opacity: .4; cursor: default; }
    button.main { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }
    .progress { flex: 1; min-width: 160px; }
    input[type=range] { width: 100%; accent-color: var(--primary); }
    .step-label { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
    .speed { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); margin-top: 8px; }
    .speed input { max-width: 180px; }
    .hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }
    body { padding-bottom: 190px; }
    @media (max-width: 760px) {
      .hint { display: none; }
      button { padding: 7px 10px; font-size: .88rem; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🧮 배열 합계 — 한 줄씩 실행해 보기</h1>
  <p class="sub">▶ 다음 버튼을 눌러 코드가 한 줄씩 실행되는 모습을 따라가 보세요.</p>

  <div class="top">
    <div class="panel code">
      <h2>📜 코드</h2>
      <div id="code"></div>
      <p class="note">※ 실제 코드의 100개 숫자 배열은 한 줄로 줄여서 표시했어요.</p>
    </div>

    <div class="panel">
      <h2>📦 변수 (값을 담아 두는 상자)</h2>
      <div class="vars">
        <div class="var" id="v-sum"><div class="name">sum</div><div class="val"></div><div class="plus"></div></div>
        <div class="var" id="v-cnt"><div class="name">cnt</div><div class="val"></div></div>
        <div class="var" id="v-i"><div class="name">i</div><div class="val"></div></div>
      </div>
      <div class="explain">
        <div class="title" id="title"></div>
        <div class="desc" id="desc"></div>
      </div>
    </div>
  </div>

  <div class="panel array-wrap">
    <h2>🔢 배열 data (칸 아래 작은 숫자는 번호(index)이고, 0부터 시작해요)</h2>
    <div class="legend">
      <span><i style="background:var(--primary-soft);border-color:var(--primary)"></i>번호로 콕 집은 칸</span>
      <span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>지금 꺼낸 칸</span>
      <span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>이미 더한 칸</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="panel console">
    <h2>🖥️ 콘솔 (console.log 결과가 나오는 곳)</h2>
    <div id="console"></div>
  </div>

  <div class="panel controls">
    <div class="row">
      <button id="btn-first">⏮ 처음</button>
      <button id="btn-prev">◀ 이전</button>
      <button id="btn-next" class="main">다음 ▶</button>
      <button id="btn-play">⏯ 자동 재생</button>
      <button id="btn-skip">⏭ 반복문 끝으로</button>
      <div class="progress"><input type="range" id="slider" min="0" value="0"></div>
      <div class="step-label" id="step-label"></div>
    </div>
    <div class="speed">
      <span>🐢 느리게</span>
      <input type="range" id="speed" min="50" max="1500" step="50" value="700" style="direction: rtl">
      <span>빠르게 🐇</span>
    </div>
    <p class="hint">키보드: ← → 로 이동, 스페이스바로 자동 재생/일시정지</p>
  </div>
</div>

<script>
  /* ---------- 화면에 보여줄 코드 ---------- */
  const CODE = [
    'const data = [1, 2, 3, ... , 100]',
    'console.log(data[0])',
    'let sum = 10',
    'sum += 7',
    'console.log(sum)',
    'let cnt = 8',
    'cnt = cnt + 1',
    'for (const i of data) {',
    '    sum += i',
    '}',
    'console.log(sum)'
  ];

  const data = Array.from({ length: 100 }, (_, i) => i + 1);

  /* ---------- 실행 과정을 미리 계산해서 "단계" 목록으로 만들기 ---------- */
  const steps = [];
  let sum = null, cnt = null;
  const out = [];

  function push(o) {
    steps.push(Object.assign({ sum, cnt, out: out.slice(), i: null, k: null, mode: 'all', phase: null, plus: null }, o));
  }

  push({ line: -1, mode: 'none', title: '👋 준비됐어요', desc: '아래 <b>다음 ▶</b> 버튼을 눌러 한 줄씩 실행해 보세요. 어디서든 <b>◀ 이전</b>으로 돌아올 수 있어요.' });

  push({ line: 0, title: '1️⃣ 배열 만들기', desc: '<b>data</b>라는 상자에 1부터 100까지 숫자 100개를 순서대로 담았어요. 칸마다 번호(index)가 붙고, <b>번호는 0부터</b> 시작해요.' });

  out.push('1');
  push({ line: 1, mode: 'pick', k: 0, title: '2️⃣ data[0] 꺼내기', desc: '<b>data[0]</b>은 "0번 칸의 값"이에요. 컴퓨터는 0부터 세기 때문에 첫 번째 칸이 0번입니다. 그 칸에 든 값은 <b>1</b>이라 콘솔에 1이 출력돼요. (data[9]라면 10번째 칸이라 10이 나와요.)' });

  sum = 10;
  push({ line: 2, title: '3️⃣ 변수 sum 만들기', desc: '<b>sum</b>이라는 상자를 만들고 <b>10</b>을 넣었어요.' });

  sum += 7;
  push({ line: 3, title: '4️⃣ sum += 7', desc: '<b>sum += 7</b>은 <b>sum = sum + 7</b>의 줄임말이에요. 지금 sum이 10이니까 10 + 7 = <b>17</b>이 다시 sum에 들어가요.' });

  out.push(String(sum));
  push({ line: 4, title: '5️⃣ sum 출력', desc: 'sum에 든 값 <b>17</b>이 콘솔에 출력돼요.' });

  cnt = 8;
  push({ line: 5, title: '6️⃣ 변수 cnt 만들기', desc: '<b>cnt</b> 상자를 만들고 <b>8</b>을 넣었어요.' });

  cnt = cnt + 1;
  push({ line: 6, title: '7️⃣ cnt = cnt + 1', desc: '8 + 1 = <b>9</b>이 cnt에 다시 들어가요. (<b>cnt++</b>와 같은 뜻이에요.) 참고로 cnt는 아래 반복문에서는 쓰이지 않아요.' });

  for (let k = 0; k < data.length; k++) {
    push({
      line: 7, mode: 'loop', phase: 'take', k, i: data[k],
      title: `🔁 ${k + 1}번째 반복 ─ 꺼내기`,
      desc: `배열의 <b>${k}번 칸</b>에 든 값 <b>${data[k]}</b>을(를) 꺼내서 <b>i</b> 상자에 넣었어요.`
    });
    const before = sum;
    sum += data[k];
    push({
      line: 8, mode: 'loop', phase: 'add', k, i: data[k], plus: data[k],
      title: `➕ ${k + 1}번째 반복 ─ 더하기`,
      desc: `<b>sum += i</b> → sum = ${before} + ${data[k]} = <b>${sum}</b>`
    });
  }
  const LOOP_END = steps.length;

  push({ line: 9, mode: 'done', title: '🏁 반복 끝', desc: '배열의 마지막 칸까지 모두 꺼내 더했어요. 그래서 <b>for문을 빠져나왔어요</b>.' });

  out.push(String(sum));
  push({
    line: 10, mode: 'done', title: '🎉 최종 결과 출력',
    desc: `처음 17에 1부터 100까지의 합 <b>5050</b>이 더해져서 <b>${sum}</b>이 됐어요. (17 + 5050 = ${sum})`
  });

  /* ---------- 화면 만들기 ---------- */
  const $ = id => document.getElementById(id);

  const codeEl = $('code');
  CODE.forEach((text, idx) => {
    const d = document.createElement('div');
    d.className = 'code-line';
    d.innerHTML = '<span class="no">' + (idx + 1) + '</span>';
    d.appendChild(document.createTextNode(text));
    codeEl.appendChild(d);
  });
  const codeLines = codeEl.querySelectorAll('.code-line');

  const gridEl = $('grid');
  data.forEach((v, idx) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = '<b>' + v + '</b><small>' + idx + '</small>';
    gridEl.appendChild(c);
  });
  const cells = gridEl.querySelectorAll('.cell');

  const slider = $('slider');
  slider.max = steps.length - 1;

  let cur = 0;
  let timer = null;
  const prevVals = {};

  function setVar(id, value) {
    const el = $(id);
    const valEl = el.querySelector('.val');
    const text = value === null ? '—' : String(value);
    el.classList.toggle('empty', value === null);
    if (prevVals[id] !== text) {
      valEl.textContent = text;
      if (prevVals[id] !== undefined && value !== null) {
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
      }
      prevVals[id] = text;
    }
  }

  function render() {
    const s = steps[cur];

    codeLines.forEach((el, idx) => el.classList.toggle('active', idx === s.line));

    setVar('v-sum', s.sum);
    setVar('v-cnt', s.cnt);
    setVar('v-i', s.i);

    const plusEl = $('v-sum').querySelector('.plus');
    plusEl.classList.remove('fly');
    if (s.plus !== null) {
      plusEl.textContent = '+' + s.plus;
      void plusEl.offsetWidth;
      plusEl.classList.add('fly');
    }

    $('title').textContent = s.title;
    $('desc').innerHTML = s.desc;

    gridEl.classList.toggle('hidden', s.mode === 'none');
    cells.forEach((c, idx) => {
      let cls = 'cell';
      if (s.mode === 'pick' && idx === s.k) cls += ' pick';
      else if (s.mode === 'loop') {
        if (idx < s.k) cls += ' done';
        else if (idx === s.k) cls += ' current' + (s.phase === 'add' ? ' added' : '');
      } else if (s.mode === 'done') cls += ' done';
      c.className = cls;
    });

    const con = $('console');
    con.innerHTML = '';
    if (s.out.length === 0) {
      con.innerHTML = '<div class="empty">(아직 출력된 내용이 없어요)</div>';
    } else {
      s.out.forEach(t => {
        const d = document.createElement('div');
        d.textContent = t;
        con.appendChild(d);
      });
    }

    slider.value = cur;
    $('step-label').textContent = '단계 ' + cur + ' / ' + (steps.length - 1);
    $('btn-first').disabled = $('btn-prev').disabled = cur === 0;
    $('btn-next').disabled = cur === steps.length - 1;
    $('btn-skip').disabled = cur >= LOOP_END;
  }

  function go(n) {
    cur = Math.max(0, Math.min(steps.length - 1, n));
    render();
  }

  function stop() {
    if (timer) clearTimeout(timer);
    timer = null;
    $('btn-play').textContent = '⏯ 자동 재생';
  }

  function tick() {
    if (cur >= steps.length - 1) { stop(); return; }
    go(cur + 1);
    timer = setTimeout(tick, +$('speed').value);
  }

  function play() {
    if (timer) { stop(); return; }
    if (cur >= steps.length - 1) go(0);
    $('btn-play').textContent = '⏸ 일시정지';
    timer = setTimeout(tick, +$('speed').value);
  }

  $('btn-first').onclick = () => { stop(); go(0); };
  $('btn-prev').onclick = () => { stop(); go(cur - 1); };
  $('btn-next').onclick = () => { stop(); go(cur + 1); };
  $('btn-play').onclick = play;
  $('btn-skip').onclick = () => { stop(); go(LOOP_END); };
  slider.oninput = () => { stop(); go(+slider.value); };

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
    else if (e.key === ' ') { e.preventDefault(); play(); }
  });

  render();
</script>
</body>
</html>
